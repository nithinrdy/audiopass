name: Build

on:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build AudioPass
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Print glibc version
        run: ldd --version

      - name: Build AudioPass
        run: cargo build --release

      - name: Archive
        run: tar -czf audiopass.tar.gz -C target/release audiopass

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: audiopass
          path: audiopass.tar.gz
          retention-days: 1
