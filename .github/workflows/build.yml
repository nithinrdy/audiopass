name: Build

on:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build AudioPass
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Print glibc version
        run: ldd --version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpipewire-0.3-dev libasound2-dev

      - name: Build AudioPass
        run: cargo build --release --locked

      - name: Create package
        run: |
          mkdir package
          cp target/release/audiopass LICENSE THIRD_PARTY PRIVACY package/
          cp -aT meta/ package/
          chmod +x package/audiopass package/install.sh package/uninstall.sh
          tar -czf audiopass.tar.gz -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: audiopass.tar.gz
          archive: false
          retention-days: 1
