name: Build and draft release on tag creation

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build AudioPass
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Print glibc version
        run: ldd --version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpipewire-0.3-dev libasound2-dev

      - name: Build AudioPass
        run: cargo build --release --locked

      - name: Create package
        run: |
          mkdir package
          cp target/release/audiopass LICENSE THIRD_PARTY PRIVACY package/
          cp -aT meta/ package/
          chmod +x package/audiopass package/install.sh package/uninstall.sh
          tar -czf audiopass.tar.gz -C package .

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" audiopass.tar.gz \
            --draft \
            --fail-on-no-commits \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
